<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายงานการตรวจอาคาร</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; background: #f5f7fa; }
    .card { background: #fff; padding: 16px; border-radius: 12px; max-width: 520px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #06c755; color: #fff; border: none; font-weight: bold; margin-top: 16px; cursor: pointer; }
    button:disabled { background: #9fdcb8; }
    .nav { display: flex; gap: 8px; margin-bottom: 14px; }
    .nav a { flex: 1; text-align: center; padding: 8px; background: #eef1f5; border-radius: 8px; text-decoration: none; color: #222; font-size: 14px; }
    .nav a.active { background: #222; color: #fff; }
    #msg { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="nav">
      <a href="index.html" class="active">รายงาน</a>
      <a href="history.html">ประวัติ</a>
      <a href="status.html">สถิติ</a>
    </div>

    <h3>แบบฟอร์มรายงานการตรวจอาคาร</h3>
    <form id="reportForm">
      <label>อาคาร</label>
      <input type="text" id="building" required placeholder="เช่น อาคาร 1" />

      <label>ห้อง / จุดตรวจ</label>
      <input type="text" id="room" required placeholder="เช่น ห้อง 201" />

      <label>สถานะ</label>
      <select id="status" required>
        <option value="ปกติ">ปกติ</option>
        <option value="พบจุดแก้ไข">พบจุดแก้ไข</option>
        <option value="เร่งด่วน">เร่งด่วน</option>
      </select>

      <label>หมายเหตุเพิ่มเติม</label>
      <textarea id="note" rows="3" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>

      <button type="submit" id="submitBtn">ส่งรายงาน</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const LIFF_ID = "YOUR_LIFF_ID";
    const GAS_URL = "YOUR_GAS_WEB_APP_URL";
    let lineUid = "";
    let lineName = "";

    async function initApp() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      const profile = await liff.getProfile();
      lineUid = profile.userId;
      lineName = profile.displayName;

      // ตรวจสิทธิ์ (โหมดเปิดอิสระชั่วคราว)
      const res = await fetch(`${GAS_URL}?action=check_auth&uid=${encodeURIComponent(lineUid)}`);
      const auth = await res.json();
      if (!auth.authorized) {
        document.body.innerHTML = "<h3 style='text-align:center;margin-top:40px;'>ไม่มีสิทธิ์เข้าถึงระบบ</h3>";
      }
    }

    document.getElementById("reportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      msg.textContent = "กำลังบันทึกข้อมูล...";

      const payload = {
        uid: lineUid,
        inspectorName: lineName,
        building: document.getElementById("building").value.trim(),
        room: document.getElementById("room").value.trim(),
        status: document.getElementById("status").value,
        note: document.getElementById("note").value.trim(),
        photoUrl: ""
      };

      try {
        // ใช้ text/plain เพื่อลดปัญหา CORS preflight กับ Google Apps Script
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          msg.style.color = "green";
          msg.textContent = "บันทึกรายงานเรียบร้อยแล้ว";
          e.target.reset();
        } else {
          msg.style.color = "red";
          msg.textContent = "บันทึกไม่สำเร็จ: " + (result.message || "");
        }
      } catch (err) {
        msg.style.color = "red";
        msg.textContent = "เกิดข้อผิดพลาดในการส่งข้อมูล";
      } finally {
        btn.disabled = false;
      }
    });

    initApp();
  </script>
</body>
</html>
